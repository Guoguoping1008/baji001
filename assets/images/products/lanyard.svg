<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgL" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F5"/>
    </radialGradient>
    <linearGradient id="lanyard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="lanyardShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgL)"/>
  <!-- Lanyard body (V shape) -->
  <path d="M 130 50 Q 200 110 270 50 L 300 360 L 200 385 L 100 360 Z" fill="url(#lanyard)" stroke="#1E3A8A" stroke-width="3"/>
  <path d="M 130 50 Q 200 110 270 50 L 300 360 L 200 385 L 100 360 Z" fill="url(#lanyardShine)"/>
  <!-- Lanyard clip -->
  <rect x="175" y="50" width="50" height="15" fill="#444" rx="3"/>
  <!-- Logo -->
  <text x="200" y="195" font-size="26" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-family="Arial">PIN</text>
  <text x="200" y="225" font-size="26" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-family="Arial">FORGE</text>
  <!-- Hook -->
  <path d="M 188 385 L 188 395 Q 188 405 198 405 L 202 405 Q 212 405 212 395 L 212 385" fill="none" stroke="#888" stroke-width="5" stroke-linecap="round"/>
</svg>