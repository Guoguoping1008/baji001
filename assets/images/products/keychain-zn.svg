<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgKZ" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F5"/>
    </radialGradient>
    <linearGradient id="zn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <radialGradient id="znInner" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#CC6600"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgKZ)"/>
  <!-- Key ring -->
  <circle cx="200" cy="80" r="38" fill="none" stroke="url(#zn)" stroke-width="14"/>
  <circle cx="200" cy="80" r="38" fill="none" stroke="#666" stroke-width="2"/>
  <!-- Main body -->
  <ellipse cx="200" cy="230" rx="95" ry="115" fill="url(#zn)" stroke="#666" stroke-width="2"/>
  <ellipse cx="200" cy="230" rx="80" ry="100" fill="url(#znInner)"/>
  <!-- Highlight -->
  <ellipse cx="160" cy="170" rx="25" ry="40" fill="#FFFFFF" opacity="0.5"/>
  <text x="200" y="270" font-size="80" text-anchor="middle">🔑</text>
  <!-- Connector -->
  <circle cx="200" cy="115" r="9" fill="#888"/>
  <circle cx="200" cy="115" r="4" fill="#444"/>
</svg>