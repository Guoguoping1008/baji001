      <stop offset="100%" stop-color="#A0A0A8"/>
    </linearGradient>
  </defs>
  <!-- 钥匙圈 -->
  <circle cx="200" cy="80" r="35" fill="none" stroke="url(#metalZn)" stroke-width="12"/>
