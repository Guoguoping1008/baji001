name = "baji001"
compatibility_date = "2024-12-01"
pages_build_output_dir = "."

# Simple Cloudflare Pages configuration
# Cloudflare Pages GitHub integration handles deployment automatically
# when this wrangler.toml file is in the repo root.

# KV namespace binding for admin/inquiry storage.
# MUST be added via Cloudflare Dashboard:
# Pages project → Settings → Functions → KV namespace bindings
# Variable name: INQUIRIES → namespace: pinforge-inquiries

# Secrets to be added via Cloudflare Dashboard:
# ADMIN_TOKEN — admin authentication
# SLACK_WEBHOOK_URL — Slack notifications
# RESEND_API_KEY — email notifications