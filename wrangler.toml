name = "baji001"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Build configuration (Cloudflare Pages)
[build]
command = "echo 'PinForge static site: no build step required, deploying root directly'"

# Cloudflare Pages Functions: KV namespace (REQUIRED for admin panel storage)
#
# Setup steps (once, after Pages project is created):
#   1. Run: wrangler kv namespace create pinforge-inquiries
#   2. Copy the ID and put it below (replace placeholder)
#   3. Or set this in Cloudflare Dashboard:
#      Pages project → Settings → Functions → KV namespace bindings
#      Variable name: INQUIRIES → Namespace: pinforge-inquiries
[[kv_namespaces]]
binding = "INQUIRIES"
# id = ""  ← Replace with actual ID from `wrangler kv namespace create` output

# Environment variables (non-secret public values)
[env.production.vars]
SITE_URL = "https://baji001.pages.dev"

# Secrets (NEVER commit these; set via `wrangler secret put NAME` or in Dashboard):
#   ADMIN_TOKEN          — admin panel authentication (32-char random)
#   SLACK_WEBHOOK_URL    — Slack channel webhook for inquiry notifications
#   RESEND_API_KEY       — Resend email API for inquiry notifications

# Node version for Functions
node_version = "20"