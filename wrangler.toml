name = "baji001"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Build configuration (Cloudflare Pages)
[build]
command = "echo 'PinForge static site: no build step required, deploying root directly'"

# KV namespace binding (REQUIRED for admin panel storage)
#
# Setup (after KV namespace is created via wrangler kv namespace create or Dashboard):
#   1. Run: wrangler kv namespace create pinforge-inquiries
#   2. Copy the ID and put it below
#   OR: Set in Cloudflare Dashboard → Pages project → Settings → Functions → KV bindings
[[kv_namespaces]]
binding = "INQUIRIES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Environment-specific overrides (must include kv_namespaces for production)
[env.production]
[env.production.vars]
SITE_URL = "https://baji001.pages.dev"

[[env.production.kv_namespaces]]
binding = "INQUIRIES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[env.preview]
[env.preview.vars]
SITE_URL = "https://preview-baji001.pages.dev"

[[env.preview.kv_namespaces]]
binding = "INQUIRIES"
id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Secrets (NEVER commit these; set via `wrangler secret put NAME` or in Dashboard):
#   ADMIN_TOKEN          — admin panel authentication (32-char random)
#   SLACK_WEBHOOK_URL    — Slack channel webhook for inquiry notifications
#   RESEND_API_KEY       — Resend email API for inquiry notifications

# Node version for Functions
node_version = "20"