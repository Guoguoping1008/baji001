name = "pinforge-b2b"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Build configuration (Cloudflare Pages)
[build]
command = "echo 'PinForge static site: no build step required, deploying root directly'"

# Cloudflare Pages Functions: KV namespace (REQUIRED for admin panel storage)
#
# IMPORTANT: To bind KV after Cloudflare Pages project is created in Dashboard,
# run locally with valid CLOUDFLARE_API_TOKEN:
#
#   wrangler kv namespace create pinforge-inquiries
#   wrangler kv namespace create pinforge-inquiries --preview
#
# Then put the IDs below. If you don't have a CLOUDFLARE_API_TOKEN yet,
# SET THESE IN CLOUDFLARE DASHBOARD UNDER SETTINGS > FUNCTIONS > KV BINDINGS
# INSTEAD of editing this file.
[[kv_namespaces]]
binding = "INQUIRIES"
# id = "REPLACE_WITH_PRODUCTION_ID"
# preview_id = "REPLACE_WITH_PREVIEW_ID"

# Environment variables (non-secret public values)
[env.production.vars]
SITE_URL = "https://pinforge-b2b.pages.dev"

# Secrets (NEVER commit these; set via `wrangler secret put NAME` or in Dashboard):
#   ADMIN_TOKEN          — admin panel authentication (32-char random)
#   SLACK_WEBHOOK_URL    — Slack channel webhook for inquiry notifications
#   RESEND_API_KEY       — Resend email API for inquiry notifications

# Node version for Functions
node_version = "20"
