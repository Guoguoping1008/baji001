name: Deploy to Cloudflare Pages

# This workflow exists for documentation purposes
# Actual deployment is via Cloudflare Pages GitHub integration (configured in Dashboard)
# This workflow is informational only - it doesn't deploy because Cloudflare Pages handles it

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# NO-OP: Cloudflare Pages GitHub integration handles deployment automatically
# This workflow exists to show deployment status (since GitHub Pages workflow runs separately)
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display deployment info
        run: |
          echo "🚀 Cloudflare Pages deployment is handled by Cloudflare GitHub integration"
          echo ""
          echo "📋 Deployment status:"
          echo "  ✅ GitHub Pages: https://guoguoping1008.github.io/baji001/"
          echo "  ☁️ Cloudflare Pages: https://pinforge-b2b.pages.dev/ (after Web UI setup)"
          echo ""
          echo "🔧 Setup Cloudflare Pages:"
          echo "  1. Visit: https://dash.cloudflare.com"
          echo "  2. Workers & Pages → Create → Pages → Connect to Git"
          echo "  3. Select: Guoguoping1008/baji001"
          echo "  4. Branch: main, Build command: (empty), Output: /"

      - name: Verify URL accessibility
        run: |
          $gh_status=$(curl -s -o /dev/null -w "%{http_code}" "https://guoguoping1008.github.io/baji001/" || echo "000")
          echo "GitHub Pages status: $gh_status"
