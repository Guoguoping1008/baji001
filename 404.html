<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | PinForge</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #FFF5F5 0%, #FFFFFF 100%);
            color: #1F2937;
            padding: 24px;
        }
        .container {
            text-align: center;
            max-width: 480px;
        }
        .code {
            font-size: 120px;
            font-weight: 800;
            color: #E63946;
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -0.04em;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #1F2937;
        }
        p {
            color: #6B7280;
            margin-bottom: 32px;
            line-height: 1.6;
            font-size: 15px;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .primary {
            background: #E63946;
            color: white;
        }
        .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230,57,70,0.3);
        }
        .secondary {
            background: white;
            color: #1F2937;
            border: 1px solid #E5E7EB;
        }
        .secondary:hover {
            background: #F9FAFB;
        }
        .lang {
            margin-top: 32px;
            font-size: 13px;
            color: #9CA3AF;
        }
        .lang a {
            color: #6B7280;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved. Check the URL or browse our catalog below.</p>
        <div class="actions">
            <a href="/en/" class="primary">Back to Home</a>
            <a href="/en/products.html" class="secondary">Browse Products</a>
        </div>
        <div class="lang">
            Other languages:
            <a href="/ja/">日本語</a>
            <a href="/zh/">中文</a>
            <a href="/ko/">한국어</a>
            <a href="/es/">Español</a>
        </div>
    </div>
</body>
</html>
